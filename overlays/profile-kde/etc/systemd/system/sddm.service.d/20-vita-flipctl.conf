# The RG Vita Pro has one screen and boots it to flipctl (vita-flipctl.service), so sddm
# does not take it at boot there; vita-session starts Plasma when asked, and leaves
# /run/vita-desktop behind to let it through.
[Service]
ExecCondition=/bin/sh -c '! grep -qa anbernic,rg-vita-pro /proc/device-tree/compatible || [ -e /run/vita-desktop ]'
