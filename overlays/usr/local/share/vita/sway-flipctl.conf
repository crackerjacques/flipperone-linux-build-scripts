# sway on the RG Vita Pro screen, with flipctl as its only window (vita-flipctl.service).
#
# The panel is 1080x1920 and mounted rotated (rotation = <270> in the DT), which sway
# does not apply on its own; 270 is the transform that is upright on the hardware.
# Turned, it is 1920x1080, and at scale 7.5 the output is exactly flipctl's 256x144,
# so its fullscreen window fills the screen. Nearest, since 7.5 is fractional and
# would otherwise blur the pixel fonts.
output * transform 270 scale 7.5 scale_filter nearest

default_border none
seat * hide_cursor 100

# flipctl hosts its apps in a headless sway of its own, so this one only ever shows
# flipctl. When flipctl exits, end the session and let the unit start it again.
exec sh -c 'cd /usr/share/flipctl && flipctl --wayland --remote 0.0.0.0:8899 --assets /usr/share/flipctl/assets/remote; swaymsg exit'
